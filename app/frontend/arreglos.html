<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arreglos — BloomLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css?v=20261106">
    <link rel="stylesheet" href="css/module.css?v=20261106">
    <style>
        /* Estilos específicos de Arreglos */
        #tabla-arreglos tbody td:nth-child(1) {
            font-family: 'SF Mono', 'Fira Mono', 'Consolas', monospace;
            font-size: 0.78rem;
            color: #6b7280;
            letter-spacing: 0.04em;
        }

        #tabla-arreglos tbody td:nth-child(2) {
            font-weight: 600;
            color: #1a2e1e;
        }

        #tabla-arreglos tbody td:nth-child(4) {
            font-weight: 700;
            color: #2b5c3c;
        }

        #tabla-arreglos tbody td:nth-child(5) {
            color: #6b7280;
            font-size: 0.84rem;
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Fila clickeable — refuerza el cursor del JS */
        #tabla-arreglos tbody tr {
            cursor: pointer;
        }

        .cat-chip {
            display: inline-flex;
            align-items: center;
            padding: 0.18rem 0.6rem;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 500;
            background: #e8f5e0;
            color: #2b5c3c;
            border: 1px solid #c5dfc9;
            white-space: nowrap;
        }

        .cost-prefix {
            font-size: 0.8em;
            font-weight: 600;
            color: #4a8c5c;
            opacity: 0.7;
            margin-right: 1px;
        }

        /* Más ancho que los demás módulos: la tabla tiene siete columnas */
        .module-wrapper {
            max-width: 1440px;
        }
    </style>
    <link rel="stylesheet" href="css/ui.css?v=20261106">
    <link rel="stylesheet" href="css/dark.css?v=20261106">
    <script src="js/theme.js?v=20261106"></script>
</head>

<body class="module-page">

    <div class="module-wrapper">

        <!-- ── Encabezado de página ── -->
        <header class="module-header">
            <a href="index.html" class="back-link">
                <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M19 12H5M12 5l-7 7 7 7"/>
                </svg>
                Menú Principal
            </a>

            <div class="page-title-block">
                <div class="page-icon">&#127826;</div>
                <div>
                    <h1 class="page-title">Arreglos</h1>
                    <p class="page-subtitle">Catálogo de diseños florales y composiciones</p>
                </div>
            </div>
        </header>

        <!-- ── Catálogo de arreglos ── -->
        <section class="card">
            <div class="card-head">
                <div>
                    <h2 class="card-title">Catálogo de Diseños</h2>
                    <p class="card-subtitle">Haz clic en cualquier fila para ver el detalle del arreglo</p>
                </div>
            </div>


            <div class="tabla-herramientas">
                <div class="search-bar">
                    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input
                        type="search"
                        id="buscador-arreglos"
                        class="search-input"
                        placeholder="Buscar por código, nombre, categoría o descripción..."
                        autocomplete="off"
                        aria-label="Buscar arreglos"
                    >
                </div>
                <span class="tabla-conteo" id="conteo-arreglos"></span>
                <button type="button" class="btn btn-secondary btn-sm" id="limpiar-filtros-arreglos" hidden>
                    Quitar filtros y orden
                </button>
            </div>

            <div class="table-scroll">
                <table id="tabla-arreglos">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Costo Total</th>
                            <th>Descripción</th>
                            <th>Creado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <!-- ── Formulario nuevo arreglo ── -->
        <section class="card">
            <div class="card-head">
                <div>
                    <h2 class="card-title">Nuevo Arreglo</h2>
                    <p class="card-subtitle">Crea un diseño floral para agregar al catálogo</p>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label" for="nombre-arreglo">Nombre del arreglo</label>
                    <input
                        type="text"
                        id="nombre-arreglo"
                        class="form-input"
                        placeholder="Ej: Centro de mesa rosas, Bouquet novia..."
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="categoria-arreglo">Categoría</label>
                    <input
                        type="text"
                        id="categoria-arreglo"
                        class="form-input"
                        placeholder="Ej: Bodas, Corporativo, Quinceañera..."
                    >
                </div>

                <div class="form-group form-group-full">
                    <label class="form-label" for="descripcion-arreglo">Descripción</label>
                    <input
                        type="text"
                        id="descripcion-arreglo"
                        class="form-input"
                        placeholder="Materiales, dimensiones, ocasión, notas de producción..."
                    >
                </div>
                
                <div class="form-group form-group-full">
                    <label class="form-label">Imagen de referencia</label>
                    <div style="display:flex; align-items:center; gap:1rem;">
                        <button type="button" class="btn btn-secondary" onclick="abrirWidgetImagen()">
                            📷 Subir imagen
                        </button>
                        <img id="preview-imagen" src="" alt=""
                            style="display:none; height:60px; border-radius:8px; border:1px solid #e5e7eb;">
                    </div>
                    <input type="hidden" id="imagen-url-arreglo">
                </div>



            </div>

            <div class="form-actions">
                <button class="btn btn-primary" onclick="crearArreglo()">
                    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    Guardar Arreglo
                </button>
            </div>
        </section>

    </div>

    <script src="https://upload-widget.cloudinary.com/global/all.js"></script>
    <script src="auth.js?v=20261106"></script>
    <script src="config.js?v=20261106"></script>
    <script src="js/ui.js?v=20261106"></script>
    <script src="js/buscador.js?v=20261106"></script>
    <script src="js/tabla.js?v=20261106"></script>
    <script src="js/arreglos.js?v=20261106"></script>

</body>

</html>
